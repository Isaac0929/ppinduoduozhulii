<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090711" />
  <meta name="description" content="献给可乐宝宝的一颗粒子爱心。" />
  <title>给可乐宝宝的一颗心</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #090711;
      --pink: #ea80b0;
      --pink-light: #ffd4e5;
      --text: #fff4f8;
      --muted: rgba(255, 231, 241, .62);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 48%, rgba(113, 27, 75, .24), transparent 38%),
        radial-gradient(ellipse at 16% 10%, rgba(64, 37, 91, .23), transparent 35%),
        radial-gradient(ellipse at 86% 88%, rgba(128, 38, 80, .16), transparent 32%),
        var(--night);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .veil {
      position: fixed;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 18%, rgba(6, 5, 14, .18) 65%, rgba(5, 4, 11, .62) 100%),
        linear-gradient(180deg, rgba(6, 5, 13, .2), transparent 24%, transparent 76%, rgba(6, 5, 13, .32));
    }

    .page {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(24px, env(safe-area-inset-top)) clamp(20px, 5vw, 72px) max(22px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .topbar, .footer { width: min(100%, 1180px); display: flex; align-items: center; justify-content: space-between; }
    .topbar { animation: fade-in .9s .15s both; }
    .signature { display: flex; align-items: center; gap: 11px; }
    .seal {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255, 194, 218, .32);
      border-radius: 50%;
      color: var(--pink-light);
      background: rgba(234, 128, 176, .09);
      box-shadow: 0 0 28px rgba(234, 128, 176, .14), inset 0 0 18px rgba(234, 128, 176, .12);
      font-family: Georgia, serif;
      font-size: 19px;
    }
    .signature-copy { display: grid; gap: 4px; }
    .signature-copy strong { font-size: 10px; font-weight: 600; letter-spacing: .25em; }
    .signature-copy span { color: var(--muted); font-size: 10px; letter-spacing: .12em; }
    .date-mark { display: flex; align-items: center; gap: 9px; color: rgba(255, 231, 241, .55); font-size: 10px; letter-spacing: .22em; }
    .date-mark::before, .date-mark::after { content: ""; width: 22px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 194, 218, .48)); }
    .date-mark::after { transform: scaleX(-1); }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(90vw, 560px);
      transform: translate(-50%, -49%);
      text-align: center;
      text-shadow: 0 2px 22px rgba(30, 5, 19, .9), 0 0 42px rgba(11, 5, 13, .9);
      animation: message-in 1.1s .25s both;
    }
    .eyebrow { margin: 0 0 13px; color: rgba(255, 207, 226, .86); font-size: 9px; letter-spacing: .42em; text-transform: uppercase; }
    h1 {
      margin: 0;
      color: #fff4f8;
      font-family: "Bodoni 72", "Songti SC", "Noto Serif CJK SC", "STSong", serif;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 400;
      letter-spacing: .12em;
      line-height: 1.2;
      text-indent: .12em;
    }
    .message-rule { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 16px auto 11px; color: var(--pink); }
    .message-rule::before, .message-rule::after { content: ""; width: clamp(28px, 5vw, 54px); height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 186, 215, .8)); }
    .message-rule::after { transform: scaleX(-1); }
    .message-rule span { font-size: 9px; line-height: 1; }
    .dedication { margin: 0; color: rgba(255, 239, 246, .88); font-family: "Songti SC", "Noto Serif CJK SC", serif; font-size: clamp(12px, 1.6vw, 15px); letter-spacing: .16em; }

    .footer { align-items: flex-end; animation: fade-in .9s .55s both; }
    .footer-note { color: rgba(255, 231, 241, .53); font-size: 10px; letter-spacing: .12em; }
    .footer-note span { color: rgba(255, 198, 220, .86); }
    .pulse-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      border: 1px solid rgba(255, 197, 221, .34);
      border-radius: 999px;
      color: #fff5f9;
      background: rgba(68, 23, 47, .34);
      box-shadow: 0 0 26px rgba(234, 128, 176, .08), inset 0 0 18px rgba(234, 128, 176, .06);
      backdrop-filter: blur(12px);
      font: inherit;
      font-size: 11px;
      letter-spacing: .1em;
      cursor: pointer;
      pointer-events: auto;
      transition: border-color .25s ease, background .25s ease, transform .25s ease, box-shadow .25s ease;
    }
    .pulse-button:hover, .pulse-button:focus-visible {
      border-color: rgba(255, 207, 226, .8);
      background: rgba(126, 46, 83, .48);
      box-shadow: 0 0 32px rgba(234, 128, 176, .23), inset 0 0 18px rgba(234, 128, 176, .12);
      transform: translateY(-2px);
      outline: none;
    }
    .pulse-button:active { transform: scale(.97); }
    .pulse-icon { color: var(--pink-light); font-size: 14px; animation: button-heartbeat 1.45s ease-in-out infinite; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes message-in { from { opacity: 0; filter: blur(8px); transform: translate(-50%, -46%); } to { opacity: 1; filter: blur(0); transform: translate(-50%, -49%); } }
    @keyframes button-heartbeat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.28); } 22% { transform: scale(1); } 32% { transform: scale(1.18); } 45% { transform: scale(1); } }

    @media (max-width: 560px) {
      .page { padding-right: 20px; padding-left: 20px; }
      .seal { width: 34px; height: 34px; }
      .signature-copy strong { font-size: 9px; }
      .signature-copy span { font-size: 9px; }
      .date-mark { font-size: 9px; letter-spacing: .12em; }
      .date-mark::before, .date-mark::after { width: 12px; }
      .message { top: 49%; width: 94vw; }
      .eyebrow { margin-bottom: 9px; font-size: 8px; }
      h1 { font-size: clamp(38px, 11vw, 48px); letter-spacing: .1em; }
      .message-rule { margin: 12px auto 9px; }
      .dedication { font-size: 11px; letter-spacing: .1em; }
      .footer { flex-direction: column-reverse; align-items: center; gap: 15px; }
      .footer-note { font-size: 9px; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .page { padding-top: 12px; padding-bottom: 12px; }
      .message { top: 51%; }
      .eyebrow { margin-bottom: 4px; }
      h1 { font-size: clamp(34px, 9vh, 48px); }
      .message-rule { margin: 7px auto 5px; }
      .footer { align-items: center; }
      .pulse-button { min-height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar">
      <div class="signature">
        <div class="seal" aria-hidden="true">♡</div>
        <div class="signature-copy">
          <strong>A LITTLE UNIVERSE</strong>
          <span>专属于可乐宝宝</span>
        </div>
      </div>
      <div class="date-mark">love with a litter dog</div>
    </header>

    <section class="message" aria-label="献给可乐宝宝">
      <p class="eyebrow">MY FAVORITE PERSON</p>
      <h1>可乐宝宝</h1>
      <div class="message-rule" aria-hidden="true"><span>✦</span></div>
      <p class="dedication">宇宙很大，偏偏最喜欢你。</p>
    </section>

    <footer class="footer">
      <div class="footer-note">每一次跳动，都在说：<span>我爱你</span></div>
      <button class="pulse-button" id="pulseButton" type="button" aria-label="让爱心再跳动一次">
        <span class="pulse-icon" aria-hidden="true">♥</span>
        <span>让心跳再响一点</span>
      </button>
    </footer>
  </main>

  <script>
    // 调整这里的参数，可以改变爱心密度、色彩和背景字符雨的节奏。
    const CONFIG = {
      heartColor: '#ea80b0',
      particleCount: 1500,
      mobileParticleCount: 850,
      outlineParticleCount: 320,
      mobileOutlineParticleCount: 200,
      heartScale: 0.39,
      mobileHeartScale: 0.41,
      beatSeconds: 0.95,
      particleSpeed: 2.8, // 基础流动速度；数值越大，流动越快。
      beatFlowBoost: 2, // 每次心跳峰值时的额外加速强度。
      particleDriftMin: 0.012,
      particleDriftMax: 0.04,
      matrixStep: 34,
      mobileMatrixStep: 27,
      matrixSpeedMin: 14,
      matrixSpeedMax: 42,
      matrixTrailLength: 11,
      sparkleCount: 72
    };

    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d', { alpha: true });
    const button = document.getElementById('pulseButton');
    const colors = [CONFIG.heartColor, '#f4a6c7', '#ffd4e5', '#fff0f6'];
    const glyphs = Array.from('可乐宝宝我喜欢你520LOVE♡♥0123456789');
    let width = 0;
    let height = 0;
    let dpr = 1;
    let particles = [];
    let outlineParticles = [];
    let rainColumns = [];
    let stars = [];
    let sparks = [];
    let pulseKick = 0;
    let previousTime = 0;
    let particleFlowPhase = 0;

    const random = (min, max) => min + Math.random() * (max - min);
    const choose = (items) => items[Math.floor(Math.random() * items.length)];
    const HEART_PATH = Array.from({ length: 360 }, (_, i) => heartPoint(i / 360 * Math.PI * 2));

    function heartPoint(t) {
      const rawX = 16 * Math.pow(Math.sin(t), 3);
      const rawY = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x: rawX / 16, y: (rawY + 2.54) / 14.47 };
    }

    function insideHeart(x, y) {
      let inside = false;
      for (let i = 0, j = HEART_PATH.length - 1; i < HEART_PATH.length; j = i++) {
        const a = HEART_PATH[i];
        const b = HEART_PATH[j];
        const crosses = (a.y > y) !== (b.y > y)
          && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x;
        if (crosses) inside = !inside;
      }
      return inside;
    }

    function makeOutlineParticles(count) {
      return Array.from({ length: count }, (_, i) => {
        const point = HEART_PATH[Math.floor(i * HEART_PATH.length / count)];
        return {
          x: point.x + random(-.009, .009),
          y: point.y + random(-.009, .009),
          size: random(1.1, 2.35),
          phase: random(0, Math.PI * 2),
          color: choose(colors)
        };
      });
    }

    function makeParticles(count) {
      const result = [];
      while (result.length < count) {
        const x = random(-1, 1);
        const y = random(-1, 1);
        if (!insideHeart(x, y)) continue;
        result.push({
          x,
          y,
          size: random(.8, 2),
          phase: random(0, Math.PI * 2),
          drift: random(CONFIG.particleDriftMin, CONFIG.particleDriftMax),
          color: choose(colors),
          glow: Math.random() < .12
        });
      }
      return result;
    }

    function makeRainColumn(x, fontSize) {
      const length = Math.floor(random(5, CONFIG.matrixTrailLength + 1));
      return {
        x,
        hue: choose([275, 285, 300, 315, 325]),
        y: random(-height, 0),
        speed: random(CONFIG.matrixSpeedMin, CONFIG.matrixSpeedMax),
        fontSize,
        length,
        alpha: random(.12, .34),
        chars: Array.from({ length }, () => choose(glyphs)),
        changeIn: random(.05, .4)
      };
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const mobile = width < 560;
      const count = mobile ? CONFIG.mobileParticleCount : CONFIG.particleCount;
      const outlineCount = mobile ? CONFIG.mobileOutlineParticleCount : CONFIG.outlineParticleCount;
      const step = mobile ? CONFIG.mobileMatrixStep : CONFIG.matrixStep;
      const fontSize = mobile ? 10 : 12;
      particles = makeParticles(count);
      outlineParticles = makeOutlineParticles(outlineCount);
      rainColumns = [];
      for (let x = step / 2; x < width + step; x += step) {
        rainColumns.push(makeRainColumn(x, fontSize));
      }
      stars = Array.from({ length: CONFIG.sparkleCount }, () => ({
        x: random(0, width), y: random(0, height), r: random(.35, 1.25), phase: random(0, Math.PI * 2)
      }));
    }

    function drawRain(dt) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const column of rainColumns) {
        column.y += column.speed * dt;
        column.changeIn -= dt;
        if (column.changeIn <= 0) {
          column.changeIn = random(.08, .36);
          column.chars[Math.floor(Math.random() * column.chars.length)] = choose(glyphs);
        }
        if (column.y - column.length * column.fontSize > height + 20) {
          column.y = random(-height * .45, -20);
          column.speed = random(CONFIG.matrixSpeedMin, CONFIG.matrixSpeedMax);
          column.alpha = random(.12, .34);
        }

        ctx.font = '300 ' + column.fontSize + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
        for (let i = 0; i < column.length; i++) {
          const y = column.y - i * column.fontSize;
          if (y < -column.fontSize || y > height + column.fontSize) continue;
          const fade = 1 - i / column.length;
          ctx.fillStyle = i === 0
            ? 'hsla(' + column.hue + ', 95%, 88%, ' + Math.min(.7, column.alpha * 2.1) + ')'
            : 'hsla(' + column.hue + ', 82%, 73%, ' + (column.alpha * fade) + ')';
          ctx.fillText(column.chars[i], column.x, y);
        }
      }
      ctx.restore();
    }

    function drawHeart(time, dt) {
      const mobile = width < 560;
      const scale = Math.min(width, height) * (mobile ? CONFIG.mobileHeartScale : CONFIG.heartScale);
      const cx = width * .5;
      const cy = height * (mobile ? .49 : .5);
      const beatPhase = ((time / 1000) % CONFIG.beatSeconds) / CONFIG.beatSeconds;
      const beatA = Math.exp(-Math.pow((beatPhase - .13) / .042, 2));
      const beatB = .64 * Math.exp(-Math.pow((beatPhase - .245) / .055, 2));
      const beat = beatA + beatB;
      const size = scale * (1 + beat * .052 + pulseKick * .105);
      // 累积运动相位，变速时保持位置连续；心跳周期越短，流动也越快。
      const flowSpeed = CONFIG.particleSpeed * (1.35 / CONFIG.beatSeconds)
        * (1 + beat * CONFIG.beatFlowBoost + pulseKick * 1.8);
      particleFlowPhase += dt * flowSpeed;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const aura = ctx.createRadialGradient(cx, cy, scale * .06, cx, cy, scale * 1.5);
      aura.addColorStop(0, 'rgba(234, 128, 176, ' + (.095 + beat * .045 + pulseKick * .035) + ')');
      aura.addColorStop(.48, 'rgba(194, 67, 127, .055)');
      aura.addColorStop(1, 'rgba(194, 67, 127, 0)');
      ctx.fillStyle = aura;
      ctx.fillRect(cx - scale * 1.5, cy - scale * 1.5, scale * 3, scale * 3);

      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      HEART_PATH.forEach((point, i) => {
        const x = cx + point.x * size;
        const y = cy - point.y * size;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.strokeStyle = 'rgba(234, 128, 176, .32)';
      ctx.lineWidth = Math.max(4, size * .018);
      ctx.shadowColor = CONFIG.heartColor;
      ctx.shadowBlur = 20 + beat * 9;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 205, 226, .78)';
      ctx.lineWidth = 1.35;
      ctx.shadowBlur = 7;
      ctx.stroke();
      ctx.shadowBlur = 0;

      for (const p of outlineParticles) {
        const sway = Math.sin(time * .001 + p.phase) * .006;
        const x = cx + (p.x + sway) * size;
        const y = cy - p.y * size;
        const twinkle = .7 + .3 * Math.sin(time * .0024 + p.phase);
        ctx.globalAlpha = .7 + twinkle * .3;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, y, p.size * twinkle, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of particles) {
        const sway = Math.sin(particleFlowPhase + p.phase) * p.drift;
        const float = Math.cos(particleFlowPhase * .82 + p.phase * 1.3) * p.drift;
        const x = cx + (p.x + sway) * size;
        const y = cy - (p.y + float) * size;
        const twinkle = .62 + .38 * Math.sin(time * .002 + p.phase);
        const radius = p.size * (.84 + twinkle * .34);

        if (p.glow) {
          ctx.globalAlpha = .13 + twinkle * .12;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(x, y, radius * 3.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = .58 + twinkle * .42;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const star of stars) {
        const alpha = .24 + .48 * (.5 + .5 * Math.sin(time * .0012 + star.phase));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffe5ef';
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawSparks(dt) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = sparks.length - 1; i >= 0; i--) {
        const spark = sparks[i];
        spark.life -= dt;
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
        spark.vy += 18 * dt;
        if (spark.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.min(1, spark.life * 1.5);
        ctx.fillStyle = spark.color;
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, spark.size * Math.min(1, spark.life * 2), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function animate(now) {
      const dt = previousTime ? Math.min((now - previousTime) / 1000, .04) : .016;
      previousTime = now;
      pulseKick = Math.max(0, pulseKick - dt * 1.45);
      ctx.clearRect(0, 0, width, height);
      drawRain(dt);
      drawHeart(now, dt);
      drawSparks(dt);
      requestAnimationFrame(animate);
    }

    function triggerPulse() {
      pulseKick = Math.min(1.3, pulseKick + 1);
      const x = width * .5;
      const y = height * (width < 560 ? .49 : .5);
      for (let i = 0; i < 30; i++) {
        const angle = random(0, Math.PI * 2);
        const speed = random(38, 142);
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: random(.55, 1.25),
          size: random(1, 2.8),
          color: choose(colors)
        });
      }
    }

    button.addEventListener('click', triggerPulse);
    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
